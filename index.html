<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Password Manager</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/9.19.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.19.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.19.0/firebase-auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.1.1/build/crypto-js.js"></script> <!-- For encryption -->
</head>
<body>
  <div class="container">
    <h1>Firebase Password Manager</h1>

    <!-- Form to add new data -->
    <div class="form-section">
      <h2>Add New Data</h2>
      <input type="text" id="name" placeholder="Name" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <textarea id="comments" placeholder="Comments"></textarea>
      <button onclick="addUserData()">Add User</button>
    </div>

    <!-- Section to fetch and decrypt data -->
    <div class="form-section">
      <h2>Fetch User Data</h2>
      <button onclick="fetchUserData()">Fetch Data</button>
      <div id="userData"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
